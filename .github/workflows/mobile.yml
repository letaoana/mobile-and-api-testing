name: Mobile tests

# Overall mobile status: passes when the latest Android and iOS runs on the same branch passed.
on:
  workflow_run:
    workflows: ['Mobile tests - Android', 'Mobile tests - iOS']
    types: [completed]

permissions:
  actions: read

jobs:
  status:
    name: Android and iOS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the latest Android and iOS results
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          failed=0
          for workflow in mobile-android.yml mobile-ios.yml; do
            conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?branch=$BRANCH&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "not run"')
            echo "$workflow: $conclusion"
            [ "$conclusion" = success ] || failed=1
          done
          exit $failed
