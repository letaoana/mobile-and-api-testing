name: Mobile tests - iOS

# Device runs are slow and costly: they run for pull requests and pushes to main that change
# the mobile tests or what they depend on, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'tests/mobile/**'
      - 'config/env.ts'
      - 'config/wdio.shared.conf.ts'
      - 'config/wdio.ios.conf.ts'
      - 'scripts/download-app.mjs'
      - 'scripts/summarise-page-source.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'tests/mobile/**'
      - 'config/env.ts'
      - 'config/wdio.shared.conf.ts'
      - 'config/wdio.ios.conf.ts'
      - 'scripts/download-app.mjs'
      - 'scripts/summarise-page-source.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      ios-version:
        description: iOS simulator version
        default: '26.5'
      spec:
        description: Spec file to run (empty = all specs)
        default: ''
      grep:
        description: Run only tests whose title matches this text (empty = all tests)
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 75
    env:
      RECORD_VIDEO: 'true'
      IOS_SIMULATOR_VERSION: ${{ inputs.ios-version || '26.5' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Download the demo app
        run: npm run app:download -- ios

      - name: Select Xcode and an iOS ${{ env.IOS_SIMULATOR_VERSION }} simulator
        run: |
          # The newest installed Xcode supports the newest simulator runtimes.
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | head -1

          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_VERSION//./-}"
          has_runtime() {
            xcrun simctl list runtimes --json \
              | jq -e --arg id "$RUNTIME" '.runtimes[] | select(.identifier == $id and .isAvailable)' >/dev/null
          }
          if ! has_runtime; then
            echo "Downloading the iOS $IOS_SIMULATOR_VERSION simulator runtime"
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_SIMULATOR_VERSION" || true
          fi
          if ! has_runtime; then
            echo "::error::iOS $IOS_SIMULATOR_VERSION simulator runtime is not available on this runner."
            xcrun simctl list runtimes
            exit 1
          fi

          NAME=$(xcrun simctl list devices available --json \
            | jq -r --arg id "$RUNTIME" '[.devices[$id][]? | select(.name | test("^iPhone [0-9]+$"))] | last | .name // empty')
          if [ -z "$NAME" ]; then
            TYPE=$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+$"))] | last | .identifier')
            NAME="iPhone $IOS_SIMULATOR_VERSION"
            xcrun simctl create "$NAME" "$TYPE" "$RUNTIME"
          fi
          echo "Using $NAME (iOS $IOS_SIMULATOR_VERSION)"
          echo "IOS_DEVICE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "IOS_PLATFORM_VERSION=$IOS_SIMULATOR_VERSION" >> "$GITHUB_ENV"

      - name: Prepare WebDriverAgent
        run: npx appium driver run xcuitest build-wda

      - name: Run tests on the simulator
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
        run: |
          args=()
          [ -n "$SPEC" ] && args+=(--spec "$SPEC")
          [ -n "$GREP" ] && args+=(--mochaOpts.grep "$GREP")
          npm run test:ios -- "${args[@]}"

      - name: Summarise failure page sources
        if: failure()
        run: node scripts/summarise-page-source.mjs reports/mobile/artifacts

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-report
          path: reports/mobile
          retention-days: 14
