name: Mobile tests - Sauce Labs

# Runs the mobile suite on Sauce Labs: Android on real devices, iOS on Sauce simulators
# (or real iPhones when a signed .ipa is provided). Needs the repository secrets
# SAUCE_USERNAME and SAUCE_ACCESS_KEY.
on:
  # Also runs when the Sauce Labs setup itself changes.
  push:
    paths:
      - 'config/wdio.sauce.*'
      - 'scripts/sauce-*.mjs'
      - '.github/workflows/mobile-sauce.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        type: choice
        options: [android, ios, both]
        default: android
      android-device:
        description: Android device name or regex (empty = any device)
        default: ''
      android-version:
        description: Android version (empty = any version)
        default: ''

concurrency:
  group: sauce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sauce:
    name: Sauce Labs (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Push runs (no inputs) cover both platforms.
        platform: ${{ (inputs.platform || 'both') == 'both' && fromJSON('["android","ios"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    env:
      SAUCE_LABS_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_LABS_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      # Data centre of the Sauce Labs account; override with the SAUCE_REGION repository variable.
      SAUCE_REGION: ${{ vars.SAUCE_REGION || 'eu-central-1' }}
      SAUCE_BUILD: '${{ github.workflow }} #${{ github.run_number }}'
      SAUCE_ANDROID_DEVICE: ${{ inputs.android-device }}
      SAUCE_ANDROID_VERSION: ${{ inputs.android-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the demo app
        run: npm run app:download -- ${{ matrix.platform }}

      - name: Upload the app to Sauce Labs
        run: npm run sauce:upload -- ${{ matrix.platform }}

      - name: List devices and platforms available to the account
        run: node scripts/sauce-list-platforms.mjs

      - name: Run tests on Sauce Labs
        run: npm run test:sauce:${{ matrix.platform }}

      - name: Summarise failure page sources
        if: failure()
        run: node scripts/summarise-page-source.mjs reports/mobile/artifacts

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sauce-${{ matrix.platform }}-report
          path: reports/mobile
          retention-days: 14
