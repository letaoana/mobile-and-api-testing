name: API tests

# Runs only when the API tests or what they depend on change; lint, type-check and
# formatting run for every change in quality.yml.
on:
  push:
    paths:
      - 'tests/api/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'tests/api/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Restful Booker API (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: reports/api
          retention-days: 14
