name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Restful Booker API (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Run API tests
        run: npm run test:api

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-report
          path: reports/api
          retention-days: 14
